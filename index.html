<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><title>Шаробесы — альфа 0.1</title></head><body><div id="stage"><div id="hud"><div class="brand">ШАРОБЕСЫ <small>АЛЬФА 0.1 · ТЕХНИЧЕСКИЙ ТЕСТ</small></div><canvas id="portrait" width="150" height="150"></canvas><div id="help">WASD / стрелки — катиться · Пробел — прыжок · Shift — таран · 1–4 — камеры · Зажать колёсико + мышь — вращать камеру</div><div id="berry-count" role="status" aria-live="polite">Ягоды: 0 / 12</div><div id="tools"><button id="camera">Камера: сзади</button><button id="snapshot">Сохранить момент</button><button id="reset">На старт</button></div><pre id="diagnostics" hidden></pre><div id="stick"><div id="knob"></div></div><div id="camera-pad" role="region" aria-label="Вращение камеры"><span>КАМЕРА<br>зажми и веди ↔ ↕</span></div><button id="jump" class="action">ПРЫЖОК</button><button id="dash" class="action">ТАРАН</button><div id="notice">Загрузка физики…</div></div></div><div id="boot" data-state="loading" role="status" aria-live="polite" style="position:fixed;inset:0;z-index:100;background:#172326;color:#fff;display:flex;align-items:center;justify-content:center;font:18px Arial,sans-serif;text-align:center"><div style="max-width:440px;padding:28px"><strong style="font-size:28px">ШАРОБЕСЫ</strong><p id="boot-message">Загружаем игру…</p><button id="boot-retry" hidden style="padding:12px 18px;background:#285b4f;color:white;border:1px solid #86ad9b;border-radius:12px;font-size:16px;cursor:pointer">Повторить загрузку</button></div></div>
<script>
(function(){
 var panel=document.getElementById('boot'),message=document.getElementById('boot-message'),retry=document.getElementById('boot-retry'),finished=false,failed=false;
 var timer=setTimeout(function(){if(!finished&&!failed){panel.dataset.state='slow';message.textContent='Загрузка занимает больше времени, чем обычно. Можно попробовать ещё раз.';retry.hidden=false;}},25000);
 function fail(text){failed=true;panel.dataset.state='failed';clearTimeout(timer);panel.hidden=false;panel.style.display='flex';message.textContent=text||'Не удалось загрузить игру. Попробуйте ещё раз.';retry.hidden=false;}
 window.__SHAROBESY_BOOT__={progress:function(text){if(!failed)message.textContent=text;},ready:function(){finished=true;panel.dataset.state='ready';clearTimeout(timer);panel.hidden=true;panel.style.display='none';},fail:fail};
 retry.onclick=function(){var url=new URL(location.href);url.searchParams.set('v',String(Date.now()));location.replace(url.href);};
 addEventListener('error',function(event){if(!finished&&(event.target instanceof HTMLScriptElement||event.target instanceof HTMLLinkElement||event instanceof ErrorEvent))fail();},true);
 addEventListener('unhandledrejection',function(){if(!finished)fail();});
})();
</script>
<script type="module" src="/src/main.ts"></script></body></html>
