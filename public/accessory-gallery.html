<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Шаробесы — восемь украшений</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#49327c,#19162d 70%);color:#fff3e8;font-family:'Trebuchet MS',Arial,sans-serif}main{max-width:1440px;margin:auto;padding:28px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:36px;margin:0;color:#ffe05e;text-shadow:0 3px #3b1749}p{color:#e4d1f3;margin:9px 0 20px;line-height:1.5}nav{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit;font-weight:bold;cursor:pointer;border:2px solid #c694ed;border-radius:20px;background:linear-gradient(#925fc8,#553382);color:#fff3ec;padding:9px 17px;text-decoration:none}button[aria-pressed=true]{background:linear-gradient(#fff277,#ffc336);color:#4b265d;border-color:#ffeeb7}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:20px}article{border:2px solid #af80e3;border-radius:24px;box-shadow:inset 0 0 0 2px #f0c7ff33,0 8px 22px #0f0b2399;background:radial-gradient(ellipse at 50% 58%,#8052b3,#30234e 74%);overflow:hidden;text-align:center;padding:13px 10px 18px}h2{margin:0;font-size:21px;min-height:27px}.picture{height:270px;display:flex;align-items:center;justify-content:center}.picture img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 13px 8px #170e2899)}article a{display:inline-block;background:linear-gradient(#ffec67,#ffbd27);border-color:#fff0ba;color:#50255d;font-size:15px;padding:8px 22px}.back{display:inline-block;margin-top:24px;font-size:16px}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:18px 12px}h1{font-size:28px}.grid{gap:10px}.picture{height:180px}h2{font-size:17px;min-height:42px}}
</style></head><body><main><header><div><h1>ШАРОБЕСЫ · Украшения</h1><p>Восемь 3D-предметов по твоим референсам. Одинаковый шар — чтобы сравнивать сами украшения.</p></div><nav aria-label="Ракурс"><button data-view="front" aria-pressed="true">Спереди</button><button data-view="side" aria-pressed="false">Сбоку</button><button data-view="back" aria-pressed="false">Сзади</button></nav></header><div class="grid" id="gallery"></div><a class="back" href="./?character-editor&amp;design-study">← Открыть пробу расцветок и качения</a></main><script>
const items=[['cap','Кепка вперёд'],['roundGlasses','Круглые очки'],['goggles','Стимпанк-очки'],['catEars','Кошачьи ушки'],['headphones','Наушники'],['viking','Шлем викинга'],['horns','Светлые рожки'],['zorro','Маска Зорро']];
const gallery=document.querySelector('#gallery');for(const [id,name]of items){const card=document.createElement('article'),title=document.createElement('h2'),picture=document.createElement('div'),img=document.createElement('img'),a=document.createElement('a');title.textContent=name;picture.className='picture';img.src='deploy-review/accessory-'+id+'-front.png';img.alt=name+' — спереди';img.dataset.id=id;img.dataset.name=name;picture.append(img);a.href='./?character-editor&design-study&item='+id;a.textContent='Примерить';card.append(title,picture,a);gallery.append(card);}
for(const button of document.querySelectorAll('nav button'))button.onclick=()=>{for(const b of document.querySelectorAll('nav button'))b.setAttribute('aria-pressed',String(b===button));const view=button.dataset.view;for(const img of gallery.querySelectorAll('img')){img.src='deploy-review/accessory-'+img.dataset.id+'-'+view+'.png';img.alt=img.dataset.name+' — '+button.textContent.toLowerCase();}};
</script></body></html>
